<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="15">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honeygain Monitor — ourproxy</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f23; color: #e0e0e0; padding: 20px; }
h1 { color: #00d4aa; font-size: 24px; margin-bottom: 20px; }
h1 span { color: #888; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
.card { background: #1a1a3e; border-radius: 12px; padding: 16px; border: 1px solid #2a2a5e; }
.card h3 { color: #00d4aa; font-size: 14px; margin-bottom: 8px; }
.card .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.status-up { background: #00d4aa22; color: #00d4aa; border: 1px solid #00d4aa44; }
.status-down { background: #ff444422; color: #ff4444; border: 1px solid #ff444444; }
.card .uptime { color: #888; font-size: 12px; margin-top: 4px; }
.card .error { color: #ff8800; font-size: 11px; margin-top: 4px; }
.stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.stat { background: #1a1a3e; border-radius: 8px; padding: 12px 20px; border: 1px solid #2a2a5e; }
.stat .value { font-size: 28px; font-weight: bold; color: #00d4aa; }
.stat .label { font-size: 12px; color: #888; }
.log { background: #0a0a1e; border-radius: 8px; padding: 12px; margin-top: 20px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; color: #aaa; }
.log .info { color: #88ff88; }
.log .warn { color: #ffaa00; }
.log .error { color: #ff4444; }
footer { text-align: center; color: #555; font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<h1>Honeygain Monitor <span>— proxy: ourproxy.sryze.cc</span></h1>
<div class="stats">
  <div class="stat"><div class="value" id="total">?</div><div class="label">Containers (hg-1 to hg-8)</div></div>
  <div class="stat"><div class="value" id="up">?</div><div class="label">Up</div></div>
  <div class="stat"><div class="value" id="down">?</div><div class="label">Down</div></div>
</div>
<div class="grid" id="containers"></div>
<div id="log" class="log"></div>
<footer>Honeygain Cluster · base: ourproxy.sryze.cc/v1 (via api.honeygain.com DNS) · refresh 15s</footer>
<script>
const BASE = "https://ourproxy.sryze.cc";
const PROXY_API = BASE + "/v1";
const CONTAINERS = 8;
const containerNames = Array.from({length: CONTAINERS}, (_, i) => `HG-${i+1}`);
const HG_EMAIL = "hgmain.fuldgu@proton.me";

function log(msg, type = "info") {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.className = type;
  const ts = new Date().toLocaleTimeString();
  line.textContent = `[${ts}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  if (el.children.length > 100) el.removeChild(el.firstChild);
}

async function checkContainer(deviceName) {
  try {
    const r = await fetch(`http://localhost:8081/api/status`, { signal: AbortSignal.timeout(5000) });
    return { device: deviceName, status: "unknown", error: "no per-device API" };
  } catch(e) {
    return { device: deviceName, status: "unknown", error: null };
  }
}

async function refresh() {
  log("Refreshing...");
  
  // 1. Ping ourproxy API
  try {
    const r = await fetch(PROXY_API + "/ping", { signal: AbortSignal.timeout(8000) });
    const ok = r.ok;
    log(ok ? `Ping OK (${r.status})` : `Ping FAIL (${r.status})`, ok ? "info" : "warn");
  } catch(e) {
    log(`Ping error: ${e.message}`, "error");
  }

  // 2. Check Docker status via backend proxy
  try {
    const r = await fetch("/api/containers", { signal: AbortSignal.timeout(10000) });
    const data = await r.json();
    updateDashboard(data);
  } catch(e) {
    log(`Docker API error: ${e.message}`, "error");
  }
}

function updateDashboard(data) {
  const grid = document.getElementById("containers");
  let up = 0, down = 0;
  let html = "";
  
  if (data.containers) {
    for (const c of data.containers) {
      const isUp = c.status === "running";
      if (isUp) up++; else down++;
      html += `
        <div class="card">
          <h3>${c.name}</h3>
          <div><span class="status ${isUp ? 'status-up' : 'status-down'}">${isUp ? 'UP' : 'DOWN'}</span></div>
          <div class="uptime">${c.uptime || 'N/A'}</div>
          ${c.error ? `<div class="error">${c.error}</div>` : ''}
        </div>
      `;
    }
  }
  
  document.getElementById("total").textContent = containerNames.length;
  document.getElementById("up").textContent = up;
  document.getElementById("down").textContent = down;
  
  if (!html) {
    html = `<div class="card"><h3>No data</h3><p>Backend API not reachable</p></div>`;
  }
  grid.innerHTML = html;
}

// Initial load
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
