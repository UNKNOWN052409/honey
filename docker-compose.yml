      - net.ipv4.tcp_fin_timeout=5
    environment:
      - UPSTREAM_PROXY_URL=socks5://res-${PAWNS_COUNTRY:-us}-sid-2:${PAWNS_PROXYRISE_PASSWORD}@${PROXYRISE_ENDPOINT:-gw.proxyrise.com:443}
      - LISTEN_ADDR=0.0.0.0:8080
      - TUNNEL_MAX_LIFETIME_SECS=600

  pawns-2:
    image: iproyal/pawns-cli:latest
    container_name: pawns-2
    restart: unless-stopped
    depends_on:
      rotate-proxy-pawns-2:
        condition: service_started
    network_mode: "service:rotate-proxy-pawns-2"
    command:
      - -email=${PAWNS_EMAIL}
      - -password=${PAWNS_PASSWORD}
      - -device-name=pawns-dev2
      - -device-id=2
      - -accept-tos

  rotate-proxy-pawns-3:
    image: honeygain-rotate-proxy:latest
    container_name: rotate-proxy-pawns-3
    restart: unless-stopped
    ports:
      - "8084:8080"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_local_port_range=10000 65535
      - net.ipv4.tcp_fin_timeout=5
    environment:
      - UPSTREAM_PROXY_URL=socks5://res-${PAWNS_COUNTRY:-us}-sid-3:${PAWNS_PROXYRISE_PASSWORD}@${PROXYRISE_ENDPOINT:-gw.proxyrise.com:443}
      - LISTEN_ADDR=0.0.0.0:8080
      - TUNNEL_MAX_LIFETIME_SECS=600

  pawns-3:
