services:
  monitor:
    image: nginx:alpine
    container_name: monitor
    restart: unless-stopped
    ports:
      - "9090:80"
    volumes:
      - ./monitor:/usr/share/nginx/html:ro

  rotate-proxy:
    image: honeygain-rotate-proxy:latest
    container_name: rotate-proxy
    restart: unless-stopped
    ports:
      - "8081:8080"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_local_port_range=10000 65535
      - net.ipv4.tcp_fin_timeout=5
    environment:
      - UPSTREAM_PROXY_URL=
      - LISTEN_ADDR=0.0.0.0:8080
      - TUNNEL_MAX_LIFETIME_SECS=600

  hg-1:
    image: honeygain/honeygain:latest
    container_name: hg-1
    restart: unless-stopped
    depends_on:
      rotate-proxy:
        condition: service_started
    network_mode: "service:rotate-proxy"
    command:
      - -email=${HG_EMAIL}
      - -pass=${HG_PASS}
      - -device=HG-1
      - -tou-accept

  hg-2:
    image: honeygain/honeygain:latest
    container_name: hg-2
    restart: unless-stopped
    depends_on:
      rotate-proxy:
        condition: service_started
    network_mode: "service:rotate-proxy"
    command:
      - -email=${HG_EMAIL}
      - -pass=${HG_PASS}
      - -device=HG-2
      - -tou-accept

  hg-3:
    image: honeygain/honeygain:latest
    container_name: hg-3
    restart: unless-stopped
    depends_on:
      rotate-proxy:
        condition: service_started
    network_mode: "service:rotate-proxy"
    command:
      - -email=${HG_EMAIL}
      - -pass=${HG_PASS}
      - -device=HG-3
      - -tou-accept

  hg-4:
    image: honeygain/honeygain:latest
    container_name: hg-4
    restart: unless-stopped
    depends_on:
      rotate-proxy:
        condition: service_started
    network_mode: "service:rotate-proxy"
    command:
      - -email=${HG_EMAIL}
      - -pass=${HG_PASS}
      - -device=HG-4
      - -tou-accept

  hg-5:
    image: honeygain/honeygain:latest
    container_name: hg-5
    restart: unless-stopped
    depends_on:
      rotate-proxy:
        condition: service_started
    network_mode: "service:rotate-proxy"
    command:
      - -email=${HG_EMAIL}
      - -pass=${HG_PASS}
      - -device=HG-5
      - -tou-accept

  hg-6:
    image: honeygain/honeygain:latest
    container_name: hg-6
    restart: unless-stopped
    depends_on:
      rotate-proxy:
        condition: service_started
    network_mode: "service:rotate-proxy"
    command:
      - -email=${HG_EMAIL}
      - -pass=${HG_PASS}
      - -device=HG-6
      - -tou-accept

  hg-7:
    image: honeygain/honeygain:latest
    container_name: hg-7
    restart: unless-stopped
