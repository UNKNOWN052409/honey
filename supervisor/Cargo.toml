[package]
name = "hg-supervisor"
version = "1.0.0"
edition = "2021"
description = "Lightweight Rust supervisor for honeygain — replaces Docker entirely"

[dependencies]
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
