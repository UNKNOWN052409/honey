# hg-supervisor v4.0 configuration — Dual-App Edition
# Honeygain + Pawns.app in a single supervisor
# For Render deployment — use env vars for credentials

# ── Shared Config ──
health_port = 8080

# ── Honeygain Section ──
# All fields from the legacy flat format work here.
# If this section is absent, the supervisor falls back to legacy flat format.
[honeygain]
enabled = true
instances = 10

# Multi-Account Config
# Honeygain allows ~10 devices per account (different networks).
# 50 instances = 5 accounts x 10 devices.
# Prefer HG_ACCOUNTS env var: HG_ACCOUNTS="email1:pass1,email2:pass2,..."
# accounts = [
#   { email = "acct1@example.com", pass = "pass1" },
#   { email = "acct2@example.com", pass = "pass2" },
# ]
email = "your_email@example.com"
pass = "your_password"
max_devices_per_account = 10

# ProxyRise Sticky Session Config
# Each instance gets a unique res-{country}-sid-{N} sticky session
proxyrise_endpoint = "gw.proxyrise.com:443"
proxyrise_api_key = "pgw-your-api-key-here"
proxy_type = "res"

# IP Verification
verify_ip = true

# Overuse Handling
overuse_cooldown_secs = 300

# Instance Resources
proxy_base_port = 9150

# Proxy Failure Handling
proxy_max_retries = 3

# Paths (adjust for local dev)
honeygain_bin = "./honeygain"
lib_dir = "./libs"

# ── Pawns.app Section ──
# Pawns.app CLI requires only email, password, and device identity.
# Application layer: NO proxy configuration — pawns-cli is completely proxy-unaware.
# Network layer: Docker containers route through rotate-proxy-pawns via iptables
# transparent proxy (same architecture as Honeygain's rotate-proxy).
# Each Pawns instance gets a unique residential IP at the container/network level.
[pawns]
enabled = false
instances = 3
email = "your_pawns_email@example.com"
password = "your_pawns_password"
accept_tos = true
pawns_bin = "./pawns-cli"
max_consecutive_errors = 5
restart_delay_secs = 5
